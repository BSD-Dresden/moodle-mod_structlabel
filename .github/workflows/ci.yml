# Purpose: find out whether this plugin still works on Moodle 4.5.
#
# This is a fork of an upstream plugin whose last release predates Moodle 4.3,
# so the coding style checks are expected to complain about things that have
# nothing to do with that question. They run, but they do not fail the build.
#
# What does fail the build:
#   install    Moodle is installed from scratch and this plugin installed into
#              it. Fatal errors in version.php, db/install.xml, db/upgrade.php
#              or anything loaded during installation surface here.
#   phplint    the code must parse under the PHP version we run.
#   savepoints db/upgrade.php must be structurally sound.
#   validate   required files and the pluginname language string must exist.
#
# Moodle 4.2 is in the matrix as a baseline: it is what the site runs today. If
# 4.2 passes and 4.5 fails, the failure is version specific and not a general
# defect in the plugin.
#
# Note what this does NOT prove: no page of the plugin is ever rendered, and
# there are no Behat tests. A green run means "installs cleanly on 4.5", not
# "the activity behaves correctly". A manual smoke test on a 4.5 instance is
# still required before relying on it.

name: Moodle plugin CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # What the site runs. This one gates the build.
          - php: '8.2'
            moodle-branch: 'MOODLE_405_STABLE'
            experimental: false
          # Readiness for the next LTS. 5.3 is not out yet, so 5.2 stands in
          # for it: same PHP and database floor, one string to change later.
          # Allowed to fail -- a red run here means work is coming, not that
          # the plugin is broken today.
          - php: '8.3'
            moodle-branch: 'MOODLE_502_STABLE'
            experimental: true

    name: Moodle ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }}

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, zip, gd, xmlrpc, soap, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8

      # The decisive step: a real Moodle of the target version, with this
      # plugin installed into it.
      - name: Install Moodle and the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ always() }}
        run: moodle-plugin-ci phplint

      - name: Check upgrade savepoints
        if: ${{ always() }}
        run: moodle-plugin-ci savepoints

      - name: Validating
        if: ${{ always() }}
        run: moodle-plugin-ci validate

      - name: PHPUnit tests
        if: ${{ always() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      # Informational from here on. An unmaintained plugin will not satisfy the
      # current coding style, and that is not what we are asking.
      - name: Moodle Code Checker
        continue-on-error: true
        if: ${{ always() }}
        run: moodle-plugin-ci phpcs

      - name: Moodle PHPDoc Checker
        continue-on-error: true
        if: ${{ always() }}
        run: moodle-plugin-ci phpdoc

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ always() }}
        run: moodle-plugin-ci phpmd

      - name: Mustache Lint
        continue-on-error: true
        if: ${{ always() }}
        run: moodle-plugin-ci mustache

      # The AMD build files here were built years ago. Worth seeing, not worth
      # blocking on.
      - name: Grunt
        continue-on-error: true
        if: ${{ always() }}
        run: moodle-plugin-ci grunt
